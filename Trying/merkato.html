<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merkato</title>
</head>
<body>
    
    <img src="img/merkato.jpe"/  alt="logo"   width="400" height="200"> 
     <br/> <br/>
    <div>
         <button>Deliver to Ethiopia</button> 
    </div> <br/>

    
<form action="/search" method="GET" aria-label="Product Search">
  
  
  <label for="search-category" class="visually-hidden">Select Category</label>
  <select name="category" id="search-category">
    <option value="all" selected>All Departments</option> <br/>
    <option value="electronics">Electronics & Tech</option>  <br/>
    <option value="fashion">Fashion & Clothes</option>   <br/>
    <option value="home">Home & Kitchen</option>
    <option value="spices">Spices & Groceries</option>
    <option value="books">Books</option>
  </select>

  
  <label for="site-search" class="visually-hidden">Search merkato</label>
  <input 
    type="search" 
    id="site-search" 
    name="q" 
    placeholder="Search merkata.com" 
    autocomplete="off" 
    required
  >
  <button type="submit" aria-label="Execute Search">
    🔍 Search
  </button>
  <div> 
    <img src="img/merkato.jpe"/  alt="logo"   width="400" height="200">
    <img src="img/merkato.jpe"/  alt="logo"   width="400" height="200">
    <img src="img/merkato.jpe"/  alt="logo"   width="400" height="200">
</div>
</form>
</body>
</html>
